name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check / Full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Documentation
        run: pnpm docs:check

      - name: Test
        run: pnpm test

      - name: Package
        run: pnpm build

      - name: Size
        run: pnpm size:check

      - name: Example
        run: pnpm examples:check

      - name: Zero Runtime Deps
        run: |
          count=$(jq -r '.dependencies // {} | length' package.json)
          if [ "$count" != "0" ]; then
            echo "LiveFlow core must have zero runtime dependencies, found $count."
            exit 1
          fi
          if jq -e '[.dependencies // {}, .devDependencies // {}] | add // {}
                    | to_entries[] | select(.value | test("^(git\\+|github:|https?://)"))' \
               package.json > /dev/null; then
            echo "Exotic (git/http) dependency specifiers are not allowed."
            exit 1
          fi

      - name: No Sourcemaps
        run: |
          if find dist -name '*.map' -print | grep -q .; then
            echo "Source maps must never be emitted or distributed."
            find dist -name '*.map'
            exit 1
          fi
          if grep -rlE 'sourceMappingURL|sourcesContent' dist; then
            echo "Build output must not reference source maps."
            exit 1
          fi
          if jq -e '.files | index("src")' package.json > /dev/null; then
            echo "Source files must not be included in the distributed package."
            exit 1
          fi

      - name: Dist Committed
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist/ does not match src/. Run 'pnpm build' and commit the result."
            echo "A deleted file here means dist/ still carried an orphaned artifact."
            git status --porcelain -- dist
            exit 1
          fi
