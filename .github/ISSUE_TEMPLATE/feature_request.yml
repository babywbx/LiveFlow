name: Feature request
description: 提出一个新能力或接口改进
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        本项目的设计边界很窄，取流、平台协议、解码实现、完整播放器 UI 和平台专用素材
        都在非目标范围内。相关约束见 CONTRIBUTING.md。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景，而不是直接描述解法
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的用法
      description: 如果已经有想法，可以写一下期望的接口大概长什么样
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 当前的替代做法、相关的浏览器限制等
